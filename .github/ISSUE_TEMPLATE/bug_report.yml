name: Bug report
description: Something stutters, jumps or looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens?
      description: Where on claude.ai, and what exactly looks off? A short screen recording helps the most.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: e.g. Firefox 154, Floorp 12.17, Chrome 142
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Claude Smooth version
      placeholder: e.g. 3.1.2
  - type: textarea
    id: settings
    attributes:
      label: Changed settings
      description: Did you change anything in the popup (speed, switches)?
