<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light dark; --accent: #d97757; }
    body { margin: 0; padding: 14px 16px; width: 260px; font: 13px/1.4 system-ui, sans-serif; }
    h1 { font-size: 14px; margin: 0 0 10px; }
    label { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 0; cursor: pointer; }
    small { display: block; opacity: .65; }
    input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; flex: none; }
    .speed { display: block; padding-top: 10px; margin-top: 4px; border-top: 1px solid color-mix(in srgb, currentColor 15%, transparent); cursor: default; }
    .speed input { width: 100%; accent-color: var(--accent); }
    .ticks { display: flex; justify-content: space-between; opacity: .65; font-size: 11px; }
  </style>
</head>
<body>
  <h1>Claude Smooth</h1>
  <label><span>Text-Streaming<small>Wörter blenden ein, Text gleitet beim Mitscrollen</small></span><input type="checkbox" id="stream"></label>
  <label><span>Menüs &amp; Dialoge<small>Weich auf- und zuklappen</small></span><input type="checkbox" id="popups"></label>
  <label><span>Seiten &amp; Nachrichten<small>Einstellungen, Chats, neue Nachrichten</small></span><input type="checkbox" id="pages"></label>
  <label><span>Sidebar &amp; Layout<small>Ein-/Ausklappen gleitet statt springt</small></span><input type="checkbox" id="layout"></label>
  <label><span>Alles einblenden<small>Jedes neue Element blendet weich ein</small></span><input type="checkbox" id="appear"></label>
  <label><span>Weichzeichnen<small>Blur-Fokus wie bei Apple (braucht etwas GPU)</small></span><input type="checkbox" id="blur"></label>
  <label><span>Klick-Federung<small>Alles gibt beim Drücken nach, Icons verwandeln sich</small></span><input type="checkbox" id="press"></label>
  <label><span>Glanz &amp; Licht-Puls<small>Licht folgt der Maus, Puls beim Klick</small></span><input type="checkbox" id="glow"></label>
  <label><span>Hover-Übergänge<small>Farben, Pfeile, Schalter</small></span><input type="checkbox" id="hover"></label>
  <label><span>Weiches Scrollen<small>Kann beim Mitscrollen nachziehen</small></span><input type="checkbox" id="scroll"></label>
  <label class="speed">Tempo
    <input type="range" id="speed" min="0.5" max="1.8" step="0.1">
    <span class="ticks"><span>schnell</span><span>sanft</span></span>
  </label>
  <script src="popup.js"></script>
</body>
</html>
