<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light dark; --accent: #10a37f; }
    body { margin: 0; padding: 14px 16px; width: 260px; font: 13px/1.4 system-ui, sans-serif; }
    h1 { display: flex; align-items: center; gap: 9px; font-size: 14px; margin: 0 0 10px; }
    label { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 0; cursor: pointer; }
    small { display: block; opacity: .65; }
    input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; flex: none; }
    .speed { display: block; padding-top: 10px; margin-top: 4px; border-top: 1px solid color-mix(in srgb, currentColor 15%, transparent); cursor: default; }
    .speed input { width: 100%; accent-color: var(--accent); }
    .ticks { display: flex; justify-content: space-between; opacity: .65; font-size: 11px; }
  </style>
</head>
<body>
  <h1><img src="icons/icon.svg" width="28" height="28" alt="">ChatGPT Smooth</h1>
  <label><span>Text streaming<small>Words fade in, text glides as it scrolls</small></span><input type="checkbox" id="stream"></label>
  <label><span>Menus &amp; dialogs<small>Smooth open and close</small></span><input type="checkbox" id="popups"></label>
  <label><span>Pages &amp; messages<small>Settings, chats, new messages</small></span><input type="checkbox" id="pages"></label>
  <label><span>Sidebar &amp; layout<small>Expanding/collapsing glides instead of jumping</small></span><input type="checkbox" id="layout"></label>
  <label><span>Fade everything in<small>Every new element fades in smoothly</small></span><input type="checkbox" id="appear"></label>
  <label><span>Blur<small>Apple-style blur focus (uses some GPU)</small></span><input type="checkbox" id="blur"></label>
  <label><span>Click spring<small>Everything yields when pressed, icons morph</small></span><input type="checkbox" id="press"></label>
  <label><span>Shine &amp; light pulse<small>Light follows the mouse, pulse on click</small></span><input type="checkbox" id="glow"></label>
  <label><span>Hover transitions<small>Colors, arrows, switches</small></span><input type="checkbox" id="hover"></label>
  <label><span>Smooth scrolling<small>May lag behind while scrolling</small></span><input type="checkbox" id="scroll"></label>
  <label class="speed">Speed
    <input type="range" id="speed" min="0.5" max="1.8" step="0.1">
    <span class="ticks"><span>fast</span><span>gentle</span></span>
  </label>
  <script src="popup.js"></script>
</body>
</html>
